name: Build Jan Manch Complete APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Generate Complete App index.html
      run: |
        cat << 'EOF' > index.html
        <!DOCTYPE html>
        <html lang="hi">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
          <title>Jan Manch - Super App with Real Calling</title>
          <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
          <style>
            :root {
              --bg-color: #0f0f0f;
              --card-bg: #1f1f1f;
              --text-white: #ffffff;
              --text-muted: #aaaaaa;
              --yt-red: #ff0000;
              --neon-cyan: #00f2fe;
              --ai-purple: #8a2be2;
              --call-green: #25d366;
            }
            * {
              box-sizing: border-box;
              margin: 0;
              padding: 0;
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
              user-select: none;
            }
            body {
              background-color: #000;
              display: flex;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              color: var(--text-white);
            }
            .mobile-screen {
              width: 100%;
              max-width: 420px;
              height: 95vh;
              max-height: 860px;
              background: var(--bg-color);
              border-radius: 28px;
              border: 3px solid #282828;
              overflow: hidden;
              position: relative;
              display: flex;
              flex-direction: column;
              box-shadow: 0 0 25px rgba(255, 0, 0, 0.2);
            }
            .status-bar {
              height: 30px;
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 0 16px;
              font-size: 11px;
              font-weight: bold;
              color: #ccc;
              background: #0f0f0f;
              z-index: 50;
            }
            .top-nav {
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 8px 14px;
              background: var(--bg-color);
              border-bottom: 1px solid #222;
              z-index: 50;
            }
            .logo-container {
              display: flex;
              align-items: center;
              gap: 6px;
              font-size: 17px;
              font-weight: bold;
            }
            .yt-badge {
              background: var(--yt-red);
              color: #fff;
              padding: 2px 7px;
              border-radius: 6px;
              font-size: 11px;
            }
            .search-box {
              display: flex;
              padding: 8px 12px;
              background: #181818;
              gap: 8px;
              border-bottom: 1px solid #222;
            }
            .search-box input {
              flex: 1;
              background: #000;
              border: 1px solid #333;
              padding: 7px 12px;
              border-radius: 20px;
              color: #fff;
              outline: none;
              font-size: 13px;
            }
            .search-box button {
              background: var(--yt-red);
              border: none;
              color: white;
              padding: 0 14px;
              border-radius: 20px;
              font-weight: bold;
              font-size: 12px;
              cursor: pointer;
            }
            .content-area {
              flex: 1;
              overflow-y: auto;
              position: relative;
              padding-bottom: 110px;
            }
            .tab-content {
              display: none;
              height: 100%;
            }
            .tab-content.active {
              display: block;
            }
            .video-card {
              margin-bottom: 16px;
              background: var(--bg-color);
            }
            .video-player-container {
              position: relative;
              width: 100%;
              aspect-ratio: 16/9;
              background: #000;
            }
            .video-player-container iframe {
              width: 100%;
              height: 100%;
              border: none;
            }
            .video-info {
              padding: 10px 14px;
              display: flex;
              gap: 12px;
              cursor: pointer;
            }
            .channel-avatar {
              width: 36px;
              height: 36px;
              border-radius: 50%;
              background: #333;
              display: flex;
              align-items: center;
              justify-content: center;
              font-weight: bold;
              font-size: 13px;
              flex-shrink: 0;
            }
            .video-details h4 {
              font-size: 13px;
              line-height: 1.3;
              margin-bottom: 4px;
              font-weight: 500;
            }
            .video-details p {
              font-size: 11px;
              color: var(--text-muted);
            }
            .chat-container {
              display: flex;
              flex-direction: column;
              height: calc(100% - 10px);
              padding: 10px;
            }
            .chat-messages {
              flex: 1;
              overflow-y: auto;
              display: flex;
              flex-direction: column;
              gap: 10px;
              padding: 8px;
            }
            .chat-bubble {
              max-width: 80%;
              padding: 9px 13px;
              border-radius: 14px;
              font-size: 13px;
              line-height: 1.4;
              word-break: break-word;
            }
            .bubble-user {
              align-self: flex-end;
              background: var(--yt-red);
              color: #fff;
              border-bottom-right-radius: 2px;
            }
            .bubble-ai {
              align-self: flex-start;
              background: #2a2a2a;
              border: 1px solid var(--ai-purple);
              color: #eee;
              border-bottom-left-radius: 2px;
            }
            .chat-input-bar {
              display: flex;
              gap: 6px;
              padding: 8px;
              background: #181818;
              border-radius: 24px;
              border: 1px solid #333;
            }
            .chat-input-bar input {
              flex: 1;
              background: transparent;
              border: none;
              color: #fff;
              outline: none;
              font-size: 13px;
              padding-left: 8px;
            }
            .chat-input-bar button {
              background: var(--ai-purple);
              border: none;
              color: #fff;
              padding: 6px 14px;
              border-radius: 20px;
              font-size: 12px;
              font-weight: bold;
              cursor: pointer;
            }
            .call-panel {
              padding: 14px;
              height: 100%;
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 10px;
            }
            .id-badge {
              background: #1a1a1a;
              padding: 8px 14px;
              border-radius: 20px;
              font-size: 12px;
              border: 1px solid #333;
              color: var(--neon-cyan);
            }
            .video-grid {
              width: 100%;
              height: 250px;
              position: relative;
              background: #000;
              border-radius: 16px;
              overflow: hidden;
              border: 2px solid #333;
            }
            #remoteVideo {
              width: 100%;
              height: 100%;
              object-fit: cover;
            }
            #localVideo {
              width: 90px;
              height: 120px;
              position: absolute;
              bottom: 10px;
              right: 10px;
              border-radius: 10px;
              object-fit: cover;
              border: 2px solid #fff;
              background: #222;
              z-index: 10;
            }
            .call-inputs {
              display: flex;
              width: 100%;
              gap: 8px;
              margin-top: 8px;
            }
            .call-inputs input {
              flex: 1;
              background: #1a1a1a;
              border: 1px solid #444;
              padding: 8px 12px;
              border-radius: 20px;
              color: #fff;
              outline: none;
              font-size: 13px;
              text-align: center;
            }
            .call-actions {
              display: flex;
              gap: 16px;
              margin-top: 6px;
            }
            .btn-circle {
              width: 48px;
              height: 48px;
              border-radius: 50%;
              border: none;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 20px;
              color: #fff;
              cursor: pointer;
            }
            .btn-call-start {
              background: var(--call-green);
            }
            .btn-call-end {
              background: var(--yt-red);
            }
            .bottom-nav {
              position: absolute;
              bottom: 48px;
              left: 0;
              width: 100%;
              height: 52px;
              background: rgba(15, 15, 15, 0.98);
              border-top: 1px solid #282828;
              display: flex;
              justify-content: space-around;
              align-items: center;
              z-index: 60;
            }
            .nav-btn {
              color: var(--text-muted);
              font-size: 10px;
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              background: none;
              border: none;
              cursor: pointer;
            }
            .nav-btn.active {
              color: #fff;
            }
            .nav-btn-center {
              background: var(--ai-purple);
              color: #fff;
              width: 38px;
              height: 38px;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 18px;
              box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
              border: 1px solid #6a0dad;
              cursor: pointer;
            }
            #admob-banner-box {
              position: absolute;
              bottom: 0;
              left: 0;
              width: 100%;
              height: 48px;
              background: #000;
              border-top: 1px solid #222;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #777;
              font-size: 11px;
              z-index: 70;
            }
          </style>
        </head>
        <body>
          <div class="mobile-screen">
            <div class="status-bar">
              <span>11:55</span>
              <span>Jan Manch Live</span>
              <span>📶 5G 99%</span>
            </div>
            <div class="top-nav">
              <div class="logo-container">
                <span class="yt-badge">▶</span>
                <span>जन मंच</span>
              </div>
              <div style="cursor: pointer; font-size: 16px;" onclick="refreshFeed()">🔄</div>
            </div>
            <div class="content-area">
              <div id="tab-feed" class="tab-content active">
                <div class="search-box">
                  <input type="text" id="searchInput" placeholder="Search YouTube videos..." value="Hindi News Live">
                  <button onclick="handleSearch()">Search</button>
                </div>
                <div id="videoList"></div>
              </div>
              <div id="tab-zini" class="tab-content">
                <div class="chat-container">
                  <div style="font-size: 13px; font-weight: bold; color: var(--neon-cyan); margin-bottom: 8px;">
                    ✨ मेरा ज़िनी (Gemini AI Live)
                  </div>
                  <div class="chat-messages" id="ziniMessages">
                    <div class="chat-bubble bubble-ai">
                      नमस्ते! मैं आपका <b>मेरा ज़िनी AI</b> हूँ। मुझसे कोई भी सवाल पूछिए!
                    </div>
                  </div>
                  <div class="chat-input-bar">
                    <input type="text" id="ziniInput" placeholder="ज़िनी से बात करें..." onkeydown="if(event.key==='Enter') sendZiniPrompt()">
                    <button onclick="sendZiniPrompt()">भेजें</button>
                  </div>
                </div>
              </div>
              <div id="tab-call" class="tab-content">
                <div class="call-panel">
                  <div class="id-badge">
                    आपकी Call ID: <b id="myCallId" style="color:#fff;">बन रही है...</b>
                  </div>
                  <div class="video-grid">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <video id="localVideo" autoplay playsinline muted></video>
                  </div>
                  <div class="call-inputs">
                    <input type="text" id="peerIdInput" placeholder="दोस्त की Call ID डालें">
                  </div>
                  <div class="call-actions">
                    <button class="btn-circle btn-call-start" onclick="makePeerCall(true)" title="Video Call">📹</button>
                    <button class="btn-circle btn-call-start" onclick="makePeerCall(false)" title="Audio Call">🎙️</button>
                    <button class="btn-circle btn-call-end" onclick="endPeerCall()" title="End Call">❌</button>
                  </div>
                  <p id="callStatusText" style="font-size: 12px; color: #aaa;">कॉल के लिए तैयार</p>
                </div>
              </div>
            </div>
            <div class="bottom-nav">
              <button class="nav-btn active" id="btn-home" onclick="switchTab('tab-feed')">
                <span>🏠</span>Home
              </button>
              <button class="nav-btn" onclick="switchTab('tab-call')">
                <span>📹</span>Call
              </button>
              <div class="nav-btn-center" onclick="switchTab('tab-zini')" title="Mera Zini AI">⚡</div>
              <button class="nav-btn" onclick="showInterstitialAd()">
                <span>🔔</span>Alerts
              </button>
              <button class="nav-btn" onclick="switchTab('tab-zini')">
                <span>💬</span>Chat
              </button>
            </div>
            <div id="admob-banner-box">AdMob Space</div>
          </div>

          <script>
            const ADMOB_APP_ID = "ca-app-pub-789065935364725~4876027857";
            const ADMOB_BANNER_ID = "ca-app-pub-789065935364725/1369633386";
            const ADMOB_INTERSTITIAL_ID = "ca-app-pub-789065935364725/7226535623";
            const YOUTUBE_API_KEY = "AIzaSyByVAA2VcVGMRrfDSXEdXUHUXPiReJN8BI";
            const GEMINI_API_KEY = "AQ.Ab8RN6ImLQdbG7twxFYTOGuvP5ijyMrActnzbJ8SJ-Gq0LfRGw";

            let clickCount = 0;
            let localStream = null;
            let peer = null;
            let currentCall = null;

            function switchTab(tabId) {
              document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
              document.getElementById(tabId).classList.add('active');
              document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
              if (tabId === 'tab-feed') document.getElementById('btn-home').classList.add('active');
              clickCount++;
              if (clickCount % 3 === 0) showInterstitialAd();
            }

            function initCallingSystem() {
              const randomId = "JM-" + Math.floor(1000 + Math.random() * 9000);
              peer = new Peer(randomId);

              peer.on('open', (id) => {
                const idElem = document.getElementById('myCallId');
                if (idElem) idElem.innerText = id;
              });

              peer.on('call', (incomingCall) => {
                const accept = confirm("कॉल आ रही है! क्या आप उठाना चाहते हैं?");
                if (accept) {
                  navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                    localStream = stream;
                    document.getElementById('localVideo').srcObject = stream;
                    incomingCall.answer(stream);
                    currentCall = incomingCall;
                    incomingCall.on('stream', (remoteStream) => {
                      document.getElementById('remoteVideo').srcObject = remoteStream;
                      const status = document.getElementById('callStatusText');
                      if (status) {
                        status.innerText = "🟢 कॉल कनेक्ट हो गई!";
                        status.style.color = "#25d366";
                      }
                    });
                  }).catch(err => {
                    alert("कैमरा या माइक परमिशन नहीं मिली");
                  });
                }
              });
            }

            async function makePeerCall(isVideo = true) {
              const friendId = document.getElementById('peerIdInput').value.trim();
              const statusText = document.getElementById('callStatusText');

              if (!friendId) {
                alert("कृपया दोस्त की Call ID दर्ज करें!");
                return;
              }

              statusText.innerText = "घंटी बज रही है...";
              statusText.style.color = "#00f2fe";

              try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                const call = peer.call(friendId, localStream);
                currentCall = call;

                call.on('stream', (remoteStream) => {
                  document.getElementById('remoteVideo').srcObject = remoteStream;
                  statusText.innerText = "🟢 कॉल कनेक्ट हो गई!";
                  statusText.style.color = "#25d366";
                });

                call.on('close', () => {
                  endPeerCall();
                });
              } catch (err) {
                console.error(err);
                statusText.innerText = "❌ कैमरा/माइक परमिशन नहीं मिली";
                statusText.style.color = "#ff4444";
              }
            }

            function endPeerCall() {
              if (currentCall) currentCall.close();
              if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
              }
              document.getElementById('localVideo').srcObject = null;
              document.getElementById('remoteVideo').srcObject = null;
              const status = document.getElementById('callStatusText');
              if (status) {
                status.innerText = "🔴 कॉल समाप्त हुई";
                status.style.color = "#ff4444";
              }
            }

            async function fetchYouTubeVideos(query = "Hindi News Live") {
              const container = document.getElementById("videoList");
              container.innerHTML = '<div style="text-align:center; padding:30px; color:#aaa;">Videos load ho rahi hain...</div>';

              const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=6&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;

              try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                  container.innerHTML = "";
                  data.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const channel = item.snippet.channelTitle;

                    const card = document.createElement("div");
                    card.className = "video-card";
                    card.innerHTML = `
                      <div class="video-player-container">
                        <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
                      </div>
                      <div class="video-info" onclick="onVideoClick()">
                        <div class="channel-avatar">▶</div>
                        <div class="video-details">
                          <h4>${title}</h4>
                          <p>${channel} • Live Video</p>
                        </div>
                      </div>
                    `;
                    container.appendChild(card);
                  });
                }
              } catch (err) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#f66;">Video fetch error. Check API key.</div>';
              }
            }

            function handleSearch() {
              const q = document.getElementById("searchInput").value;
              if (q) fetchYouTubeVideos(q);
            }

            function refreshFeed() {
              const q = document.getElementById("searchInput").value || "Hindi News Live";
              fetchYouTubeVideos(q);
            }

            function onVideoClick() {
              clickCount++;
              if (clickCount % 2 === 0) showInterstitialAd();
            }

            async function sendZiniPrompt() {
              const input = document.getElementById("ziniInput");
              const prompt = input.value.trim();
              if (!prompt) return;

              const chatBox = document.getElementById("ziniMessages");
              const userBubble = document.createElement("div");
              userBubble.className = "chat-bubble bubble-user";
              userBubble.innerText = prompt;
              chatBox.appendChild(userBubble);
              input.value = "";

              const aiBubble = document.createElement("div");
              aiBubble.className = "chat-bubble bubble-ai";
              aiBubble.innerHTML = "<i>ज़िनी सोच रहा है...</i>";
              chatBox.appendChild(aiBubble);
              chatBox.scrollTop = chatBox.scrollHeight;

              const geminiEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

              try {
                const res = await fetch(geminiEndpoint, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                  aiBubble.innerHTML = `<b>मेरा ज़िनी:</b> ${data.candidates[0].content.parts[0].text}`;
                } else {
                  aiBubble.innerHTML = "<b>मेरा ज़िनी:</b> उत्तर प्राप्त नहीं हो सका।";
                }
              } catch (err) {
                aiBubble.innerHTML = "<b>मेरा ज़िनी:</b> सर्वर से कनेक्ट करने में दिक्कत आई।";
              }
              chatBox.scrollTop = chatBox.scrollHeight;
            }

            function showInterstitialAd() {
              console.log("Triggering Interstitial Ad");
            }

            window.onload = () => {
              fetchYouTubeVideos();
              initCallingSystem();
            };
          </script>
        </body>
        </html>
        EOF

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

    - name: Initialize Project & Capacitor
      run: |
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        npx cap init "Jan Manch" "com.janmanch.app" --web-dir .
        npx cap add android
        npx cap sync android

    - name: Add Android Permissions & AdMob ID
      run: |
        sed -i '/<application/i \
        <uses-permission android:name="android.permission.INTERNET" />\n\
        <uses-permission android:name="android.permission.CAMERA" />\n\
        <uses-permission android:name="android.permission.RECORD_AUDIO" />\n\
        <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml
        
        sed -i '/<application/a \
        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-789065935364725~4876027857"/>' android/app/src/main/AndroidManifest.xml

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: JanManch-Release-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
